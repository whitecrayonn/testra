[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testra-ml"
version = "0.0.0"
description = "Testra ML inference service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["api"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` idiom relies on call-in-default-argument, so
# this bugbear rule is a false positive for every FastAPI route.
ignore = ["B008"]
