name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testra
          POSTGRES_PASSWORD: testra
          POSTGRES_DB: testra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testra"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Consumed by the migrator and by database-backed tests. Without this the
      # queue/db integration tests silently skip (see internal/queue/queue_test.go).
      DATABASE_URL: postgres://testra:testra@localhost:5432/testra?sslmode=disable
      TEST_DATABASE_URL: postgres://testra:testra@localhost:5432/testra?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: apps/api/go.sum

      - name: Build
        run: go build ./apps/api/...
        working-directory: .

      - name: Vet
        run: go vet ./apps/api/...
        working-directory: .

      - name: Migrate
        run: go run ./apps/api/cmd/migrator
        working-directory: .

      - name: Test
        run: go test -race -count=1 ./apps/api/...
        working-directory: .

      - name: Test (integration)
        # -p=1 serializes package execution: internal/integration's
        # TestTenantIsolation drops and recreates the public schema as test
        # setup, which would race against other integration-tagged packages
        # (e.g. tests/integration) writing to the same database if run
        # concurrently.
        run: go test -tags=integration -count=1 -p=1 ./apps/api/...
        working-directory: .

  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm turbo run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  openapi:
    name: OpenAPI / SDK sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: apps/api/go.sum

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check OpenAPI drift against chi router
        run: node scripts/check-openapi-drift.mjs

      - name: Regenerate TypeScript SDK from OpenAPI
        run: pnpm --filter @testra/sdk generate

      - name: Typecheck SDK
        run: pnpm turbo run typecheck --filter @testra/sdk

  security-scan:
    name: Security scan (Trivy + SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: apps/api/go.sum

      - name: Build API binary
        run: go build -o bin/testra-api ./apps/api/cmd/api
        working-directory: .

      - name: Build worker binary
        run: go build -o bin/testra-worker ./apps/api/cmd/worker
        working-directory: .

      # Report-only for now (exit-code 0): this is the first time these
      # manifests have been scanned, and it already surfaces real pre-existing
      # CRITICAL/HIGH CVEs (e.g. next.js CVE-2025-29927, pgx CVE-2026-33815)
      # that predate this job and need their own dedicated upgrade/test pass.
      # Flip exit-code to "1" once those are remediated so this gate blocks
      # future regressions.
      - name: Trivy vulnerability scan (dependency manifests + built binaries)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  ml:
    name: ML (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
